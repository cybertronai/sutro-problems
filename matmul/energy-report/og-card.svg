<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">One femtojoule per scored grid step</title>
  <desc id="desc">Social card for the Sutro 16 by 16 matrix multiplication energy report.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4eb"/>
      <stop offset="1" stop-color="#efe8db"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f7a68"/>
      <stop offset="1" stop-color="#d9572d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1110" cy="-30" r="260" fill="#d9572d" opacity=".10"/>
  <circle cx="35" cy="570" r="270" fill="#155f77" opacity=".10"/>
  <rect x="46" y="42" width="1108" height="546" rx="28" fill="none" stroke="#10223c" stroke-opacity=".18" stroke-width="2"/>

  <text x="82" y="103" fill="#155f77" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" letter-spacing="3">SUTRO PROBLEMS · ENERGY NOTE</text>
  <text x="82" y="218" fill="#10223c" font-family="Georgia, serif" font-size="73" font-weight="700" letter-spacing="-2">One femtojoule</text>
  <text x="82" y="296" fill="#10223c" font-family="Georgia, serif" font-size="73" font-weight="700" letter-spacing="-2">per scored grid step.</text>
  <text x="84" y="349" fill="#566477" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">16×16 matmul · compiler audit + measured-chip comparison</text>

  <line x1="82" y1="391" x2="1118" y2="391" stroke="#10223c" stroke-opacity=".18" stroke-width="2"/>
  <text x="82" y="467" fill="#b63e1e" font-family="Georgia, serif" font-size="52" font-weight="700">66.3 pJ</text>
  <text x="82" y="505" fill="#566477" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">movement-only proxy</text>

  <text x="414" y="467" fill="#10223c" font-family="Georgia, serif" font-size="52" font-weight="700">5.14×</text>
  <text x="414" y="505" fill="#566477" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">lower than baseline</text>

  <text x="714" y="467" fill="#10223c" font-family="Georgia, serif" font-size="52" font-weight="700">1 fJ</text>
  <text x="714" y="505" fill="#566477" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">per operand-grid-step</text>

  <rect x="1002" y="433" width="116" height="12" rx="6" fill="#10223c" opacity=".12"/>
  <rect x="1002" y="433" width="24" height="12" rx="6" fill="url(#bar)"/>
  <rect x="1002" y="462" width="116" height="12" rx="6" fill="#10223c" opacity=".12"/>
  <rect x="1002" y="462" width="84" height="12" rx="6" fill="url(#bar)"/>
  <rect x="1002" y="491" width="116" height="12" rx="6" fill="#10223c" opacity=".12"/>
  <rect x="1002" y="491" width="110" height="12" rx="6" fill="url(#bar)"/>

  <text x="82" y="558" fill="#10223c" opacity=".62" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1">PRIMARY SOURCES · EXPLICIT SCOPE LABELS · DOWNLOADABLE DATA</text>
