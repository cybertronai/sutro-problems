# name: mnist-medium-2pct
# GENERATED by make_bands.py from bands.json -- do not edit by hand.

files:
  - {"name": "submission.py", "source": "@SUBMISSION@"}
  - {"name": "task.py", "source": "../task.py"}
  - {"name": "utils.py", "source": "../utils.py"}
  - {"name": "reference.py", "source": "../reference.py"}
  - {"name": "mnist_data.py", "source": "../mnist_data.py"}
  - {"name": "eval.py", "source": "../eval.py"}

lang: "py"

description: |
  MNIST-medium, 2% error band. Train a classifier from scratch and predict,
  on the GPU, in as little time as possible.

  Every call receives 10,000 labelled training examples and 10,000 unlabelled
  test examples, all resident on the GPU:

    custom_kernel((train_x, train_y, test_x)) -> labels

    train_x  (10000, 60) float32
    train_y  (10000,) int64 in [0, 9]
    test_x   (10000, 60) float32
    return   (10000,) integer labels in [0, 9]

  Examples are not pixels. Each draw is released as z = Q W (x - mu): the
  draw's 9x9 images are whitened onto the top 60 principal directions
  of that draw's own training rows, then rotated by a Haar-random orthogonal
  matrix that is secret and redrawn for every draw. One map is fitted on the
  training rows and applied to both halves, so the halves stay comparable, and
  the map is never published. Over the training rows the release has zero mean
  and identity covariance, but the tails are heavy and unbounded: about 2
  values in 10,000 exceed 6 in magnitude and the largest in a draw runs past
  10, so do not size a fixed-point or int8 scale from a nominal range. Column
  j is not a pixel, adjacent columns are not adjacent pixels, and there is no
  grid to convolve over: a precomputed spatial feature extractor cannot be
  smuggled in, and no fixed inverse undoes the map.

  The ranked number is the mean CUDA-event time of one complete
  training-and-prediction call over 11 fresh draws. Each draw is a new random
  10,000/10,000 split of the official MNIST training set, drawn so that no test
  image is ever shown with a label, and with a secret per-draw label
  permutation. One warm-up call is untimed, on a draw from a different dataset:
  compilation, autotuning and CUDA graph capture are free, training is not.

  All 11 timed calls are also scored. The submission qualifies when
  sum(correct) >= 107,800 of 110,000, i.e. a mean error of at most 2%, and
  no single draw may fall more than 1.5 percentage points below the band.
  A leaderboard run interleaves 2 further calls on equally shaped draws from
  a different dataset at secret positions; they are timed and ranked like the
  rest, and must be at least 70% correct in aggregate. A submission that
  memorizes MNIST instead of learning fails that check.

  A submission file is limited to 20,480 bytes, with no literal over
  4,096 bytes, so an entry cannot carry the dataset with it.

  Rules, the full protocol and the design notes are in the competition README.

config:
  main: "eval.py"

templates:
  Python: "submission.py"

test_timeout: 300
benchmark_timeout: 600
ranked_timeout: 1200
ranking_by: "last"

